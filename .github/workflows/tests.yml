name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v5

      - name: Installer Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vérifier les options du programme
        run: sh check_script_options.sh

      - name: Vérifier les grilles de test
        run: sh check_tests.sh
